# W5-6: keyword notes use the normal report path and never enter Git.
version: 1
id: w5-report
title: "W5 report keyword parity E2E bank"
driver: tests/e2e/drivers/w5_local.sh
actor: tests/e2e/drivers/w5_report_actor.py

cases:
  - id: keyword_note_report
    kind: security
    steps:
      - "render the real report pipeline from one keyword-containing synthetic note"
      - "require the same successful report path"
      - "require the generated note marker to be absent from Git history"
    expect:
      report_exit: 0
      keyword_note_processed: true
      output_private: true
      git_history_note_absent: true
      error: null
