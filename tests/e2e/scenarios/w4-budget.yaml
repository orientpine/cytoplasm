# W4-5 scenario bank: budget query + change-detection -> request-mail draft ->
# approval gate -> gws gmail send (W4-3), GO branch.
#
# Approval-gate focus:
#   * NO request mail before an owner-bound approval record (W1-6 signed
#     injection stands in for cha's manual ✅, E2E-runner-only);
#   * per-branch approval-log accounting: the ONE approved send appends exactly
#     2 records (1 external_effect.approval for gws_gmail_send + 1
#     budget.request_mail audit) with the W0-6 schema;
#   * gate-bypass NEGATIVE: a direct `gws gmail +send` tool call with NO
#     approval record is fail-closed by the deployed pre_tool_call rules, and a
#     signed E2E record is REJECTED outside E2E mode (production guard);
#   * peer-bot NEGATIVE: forged signature / non-owner approval => 0 send.
#
# Isolation: fully offline (sheet fixtures + stub gws binary in a temp dir);
# amounts masked on the owner-DM approval surface; zero real sends.
version: 1
id: w4-budget
title: "W4 budget request-mail GO-branch E2E bank (approval-gate hardened)"
driver: tests/e2e/drivers/w4_local.sh
actor: tests/e2e/drivers/w4_budget_actor.py

cases:
  - id: query_snapshot
    kind: happy
    steps:
      - "!budget query returns fixture-parity rows (3 items, item filter, unknown-item exit 2)"
      - "baseline snapshot + unchanged snapshot: zero drafts, zero gws calls, zero approval records"
    expect:
      query_exit: 0
      query_rows: 3
      query_ok_marker: true
      item_filter_rows: 1
      unknown_item_exit: 2
      baseline_created: true
      no_change_no_draft: true
      gws_calls: 0
      approval_records: 0
      error: null

  - id: draft_masked
    kind: happy
    steps:
      - "sheet change detected -> request-mail draft created; raw figure never leaks (MASKED rendering)"
      - "snapshot watermark advances; still zero gws calls and zero approval records"
    expect:
      draft_created: true
      draft_masked: true
      raw_amount_leaked: false
      snapshot_advanced: true
      gws_calls: 0
      approval_records: 0
      error: null

  - id: approved_send
    kind: happy
    steps:
      - "owner-signed injected approval (W1-6) -> confirm -> exactly 1 frozen-argv gws gmail +send"
      - "approvals.jsonl gains exactly 2 records (1 gate approval + 1 sent audit), W0-6 schema, owner-bound"
      - "deployed gate rules allow the SAME action hash in E2E mode but reject the E2E record in production mode"
      - "double confirm is refused with no second send; send log masks the recipient"
    expect:
      confirm_exit: 0
      sent_via_signed_injection: true
      gws_calls: 1
      send_argv_is_gmail_send: true
      approval_records_total: 2
      gate_approval_records: 1
      audit_sent_records: 1
      approval_schema_valid: true
      approval_target_id: "tool:gws_gmail_send:gws"
      approval_owner_bound: true
      gate_hash_matches_record: true
      gate_allows_approved_hash_e2e: true
      production_rejects_e2e_record: true
      double_confirm_rejected: true
      sends_after_double_confirm: 1
      send_log_sent: true
      recipient_leaked_in_send_log: false
      error: null

  - id: gate_bypass
    kind: failure
    fault: "direct gws gmail +send tool call without any owner-bound approval record"
    steps:
      - "evaluate a fresh gmail-send tool call against the deployed denylist: external effect, BLOCKED (approval_required)"
      - "a second pending draft confirms nothing without approval (fail-closed)"
      - "send count and approval-log line count unchanged"
    expect:
      bypass_is_external_effect: true
      bypass_blocked: true
      bypass_reason: "approval_required"
      second_draft_created: true
      confirm_without_approval_rejected: true
      sends_after_bypass_attempts: 1
      approval_records_after_bypass: 2
      error: null

  - id: peer_bot_approval
    kind: failure
    fault: "bot(peer) approval / forged signature instead of the owner"
    steps:
      - "forged-signature injected approval -> rejected; non-owner (peer bot) approval -> rejected"
      - "0 additional sends, 0 additional approval records; the rejected draft is discarded"
    expect:
      forged_signature_rejected: true
      peer_bot_confirm_rejected: true
      sends_after_peer_attempts: 1
      approval_records_after_peer: 2
      rejected_draft_discarded: true
      error: null
