# W5-6: keyword prompt addition uses the same permission-protected overlay.
# The actor uses a synthetic marker generated at runtime; no body is
# recorded in this scenario or its report.
version: 1
id: w5-prompt
title: "W5 prompt keyword-storage E2E bank"
driver: tests/e2e/drivers/w5_local.sh
actor: tests/e2e/drivers/w5_prompt_actor.py

cases:
  - id: keyword_inline_storage
    kind: security
    steps:
      - "add a keyword-containing synthetic prompt through the real prompt CLI"
      - "require inline overlay storage and a 0700 directory"
      - "require the generated marker to be absent from the repository history"
    expect:
      add_exit: 0
      inline: true
      private_path_created: false
      overlay_dir_mode: "0700"
      overlay_body_empty: false
      overlay_inline: true
      repo_body_absent: true
      git_history_body_absent: true
      error: null
