# W3-6 scenario bank: the Wave-3 agent-to-agent coordination protocol (W3-3),
# wrapped around the already-verified E2E orchestrator
# tests/e2e/w3_3_coordination.sh (reused as-is — wrap, don't duplicate).
#
# What the wrapped script proves per run (all unattended, deterministic peer
# brain, signed-injection owner confirms under E2E_TEST_MODE scoped to the
# runner processes only):
#   no_auto_accept  peer offers slots -> agent proposes -> the live peer declines
#            although nothing asked it to and our owner confirm is injected
#            (v1 safety floor W-F2.5-C, 8fd3d330: no auto-accept) -> exactly 1
#            renegotiation -> exit 5, termination DM, ZERO calendar writes.
#            Until 2026-08-14 this case was `happy` (peer accepts -> gated
#            write); that path was removed on purpose and returns with the
#            bilateral approval flow of W-F2.5-D (v2). Why the normal path
#            cannot run here and what covers it meanwhile:
#            docs/guide/interop-규약.md § "v1 안전 최소선".
#   refusal  peer declines twice -> exactly 1 renegotiation -> exit 5,
#            termination DM, ZERO calendar writes.
#   deadlock peer gateway stopped -> injected 15s timeout -> exit 4,
#            escalation DM ("인간 협의"), ZERO calendar writes; peer gateway
#            restarted afterwards.
#   overall  both gateways active at the end; script exit 0 only if all pass.
#
# The wrapped script asserts each observable itself (approvals deltas, event
# counts, DM presence, cascade monitor); this scenario re-exposes those
# self-asserted markers to the bank judge for failure isolation.
version: 1
id: w3-coordination
title: "W3 agent-to-agent coordination E2E bank (no auto-accept + refusal + deadlock)"
driver: tests/e2e/drivers/w3_coordination.sh
# The bank may rerun this full live Discord/SSH integration once after a
# transient driver failure; unmarked offline scenarios always remain exact,
# single-attempt checks.  Every retry reruns the same strict self-assertions.
live_retry: true
remote_host: <primary-node>
remote_account: agent

cases:
  - id: no_auto_accept
    kind: security
    steps:
      - "live peer slot negotiation with the owner confirm injected and no decline simulation"
      - "peer declines both proposals -> exactly 1 renegotiation -> exit 5 + termination DM"
      - "zero calendar writes proven (approvals delta 0, event count unchanged)"
    expect:
      no_auto_accept_pass_full: true
      error: null

  - id: deadlock
    kind: failure
    fault: "peer gateway stopped -> coordination times out (15s injected)"
    steps:
      - "request against stopped peer -> exit 4 + escalation DM (인간 협의)"
      - "zero calendar writes proven (approvals delta 0, event count unchanged)"
    expect:
      deadlock_pass_full: true
      error: null

  - id: refusal
    kind: failure
    fault: "peer declines every candidate (simulate marker)"
    steps:
      - "peer declines twice -> exactly 1 renegotiation -> exit 5 + termination DM"
      - "zero calendar writes proven"
    expect:
      refusal_pass_full: true
      error: null

  - id: overall
    kind: happy
    steps:
      - "wrapped script exit 0 (its own PASS gate over all scenarios)"
      - "both hermes gateways (agent, peer) active at the end of the run"
    expect:
      script_exit: 0
      e2e_pass: true
      gateway_agent_active: true
      gateway_peer_active: true
      error: null
