# W5-6: patent preparation uses the account-configured model and
# preserves the generated synthetic invention marker outside Git.
version: 1
id: w5-patent
title: "W5 patent-prep account-configured E2E bank"
driver: tests/e2e/drivers/w5_local.sh
actor: tests/e2e/drivers/w5_patent_actor.py

cases:
  - id: account_configured_private_draft
    kind: security
    steps:
      - "draft from a synthetic private brief"
      - "require the account-configured route"
      - "require the generated marker to be absent from Git history"
    expect:
      draft_exit: 0
      account_route: true
      workspace_private: true
      git_history_invention_absent: true
      error: null
