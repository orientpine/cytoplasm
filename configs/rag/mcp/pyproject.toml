[project]
name = "personal-rag-mcp"
version = "0.1.0"
description = "Authenticated personal-memory MCP service"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=3.2,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "all"
