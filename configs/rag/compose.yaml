name: personal-rag

services:
  embedding:
    build: ./embedding
    environment:
      EMBEDDING_MODEL: BAAI/bge-m3
      HF_HOME: /models/huggingface
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m
    ports:
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    volumes:
      - embedding_model_cache:/models/huggingface

  qdrant:
    image: qdrant/qdrant:v1.15.5
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    restart: unless-stopped
    volumes:
      - qdrant_personal_cha:/qdrant/storage

  mcp:
    build: ./mcp
    depends_on:
      embedding:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      RAG_COLLECTION_NAME: personal_cha
      RAG_EMBEDDING_DIMENSION: "1024"
      RAG_EMBEDDING_URL: http://embedding:8001
      RAG_MCP_API_KEY: ${RAG_MCP_API_KEY:?RAG_MCP_API_KEY is required}
      RAG_QDRANT_URL: http://qdrant:6333
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      - "${MCP_BIND_ADDRESS:?MCP_BIND_ADDRESS is required}:8765:8765"
    restart: unless-stopped

volumes:
  embedding_model_cache:
    name: personal_rag_bge_m3_model_cache_20260715
  qdrant_personal_cha:
    name: personal_rag_qdrant_personal_cha_20260715
