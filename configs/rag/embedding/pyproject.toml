[project]
name = "personal-rag-embedding"
version = "0.1.0"
description = "Local-only BGE-M3 embedding service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "sentence-transformers==5.1.2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_server"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D"]

[tool.basedpyright]
typeCheckingMode = "all"
reportAny = "none"
