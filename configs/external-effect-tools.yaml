rules:
  - id: gws_gmail_send
    tool_name_regex: (?i)^(?:terminal|shell|bash|gws)$
    arguments_regex: (?i)(?:^|[^A-Za-z0-9_])gws\s+gmail\s+\+send(?:\s|$)
  - id: gws_calendar_mutation
    tool_name_regex: (?i)^(?:terminal|shell|bash|gws)$
    arguments_regex: (?i)(?:^|[^A-Za-z0-9_])gws\s+calendar\s+events\s+(?:insert|create|update|patch|delete|quickAdd|import|move)(?:\s|$)
  - id: gws_tasks_mutation
    tool_name_regex: (?i)^(?:terminal|shell|bash|gws)$
    arguments_regex: (?i)(?:^|[^A-Za-z0-9_])gws\s+tasks\s+tasks\s+(?:insert|patch|update|delete|move|clear)(?:\s|$)
  - id: mailon_send
    tool_name_regex: (?i)^(?:terminal|shell|bash|python|python3)$
    arguments_regex: (?i)(?:^|[^A-Za-z0-9_])(?:python3?\s+-m\s+)?mailon(?:\.main)?(?:\s+\S+)*\s+send(?:\s|$)
  - id: obsidian_write_note_push
    tool_name_regex: (?i)^obsidian_write\.note_push$
    arguments_regex: .*
  - id: generic_external_effect_tool
    tool_name_regex: (?i).*(?:(?:send|submit|post).*?(?:external|remote|webhook|message)|(?:external|remote|webhook|message).*?(?:send|submit|post)).*
    arguments_regex: .*
  - id: generic_external_post_command
    tool_name_regex: (?i)^(?:terminal|shell|bash)$
    arguments_regex: (?i)\b(?:curl|http)\b.*(?:-X\s*POST|\sPOST\s).*https?://
  - id: patent_draft_drive_upload
    tool_name_regex: (?i)^(?:terminal|shell|bash|gws)$
    arguments_regex: (?i)(?:^|[^A-Za-z0-9_])gws\s+drive\s+(?:files\s+create|\+upload)\b.*patent-drafts
