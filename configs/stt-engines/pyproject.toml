[project]
name = "stt-engines"
version = "0.1.0"
description = "Isolated community-1 diarization and Korean forced alignment CLI"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pyannote.audio==4.0.7",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchvision==0.23.0",
  "whisperx==3.8.6",
  "huggingface-hub==0.36.0",
]

[project.scripts]
stt-engines = "stt_engines_cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["stt_engines_cli.py", "stt_engines_runtime.py"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
# cu128의 2.8.0 aarch64 휠 부재로 CPU에 고정한다. GB10 CUDA는 미검증이다.
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
