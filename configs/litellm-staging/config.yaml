model_list:
  # 2026-09-03: zai/glm-5.2 → gpt-5-mini → gpt-5.6-luna. Z.ai 잔액 소진(09-03 00:21 KST~ 전 요청
  # 429)으로 배치 파이프라인이 전부 폴백됐다. luna 는 같은 프롬프트에서 mini·terra 와 같은 판정을
  # 냈고 입력 단가가 glm 의 1/7(0.20 vs 1.40 USD/Mtok), 컨텍스트 922k 다. 실측 볼륨(peer 하루
  # ≈7M 입력 토큰)에서 월 ≈47 USD. 별칭·태그·예산은 그대로다(routing-policy §3) — 호출부는 모른다.
  # reasoning_effort=none: 분류·한 줄 요약에 추론 토큰이 필요 없다(luna 는 minimal 을 거부한다).
  - model_name: glm-main
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
      reasoning_effort: none
      tags: ["default", "non-patent-sensitive"]
    model_info:
      id: glm-main-openai-gpt-5-6-luna
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000012

router_settings:
  enable_tag_filtering: true

litellm_settings:
  drop_params: true
  callbacks: custom_callbacks.proxy_handler_instance
  default_key_generate_params:
    models: ["glm-main"]
    max_budget: os.environ/LITELLM_MONTHLY_HARD_CAP
  upperbound_key_generate_params:
    max_budget: os.environ/LITELLM_MONTHLY_HARD_CAP
    budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  fail_closed_budget_enforcement: true
  alerting: ["webhook"]
  alert_types: ["budget_alerts"]
  alerting_args:
    budget_alert_ttl: 86400
