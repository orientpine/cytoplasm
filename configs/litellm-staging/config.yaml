model_list: []
  # 2026-10-07: glm-main(openai/gpt-5.6-luna, OpenAI API 키) 제거. 2026-09-29 이후 모든 모델 호출은
  # Hermes 주 모델(Codex OAuth)·fallback_providers 로 가고 이 별칭을 부르는 코드가 없다.
  # 실사용은 9/28 peer 3건이 마지막이었고, OpenAI 조직 크레딧 경고로 키 사용처를 정리했다.
  # 다시 별칭을 열려면 git 이력의 이전 항목과 그 키를 함께 되살린다.

router_settings:
  enable_tag_filtering: true

litellm_settings:
  drop_params: true
  callbacks: custom_callbacks.proxy_handler_instance
  default_key_generate_params:
    models: ["glm-main"]
    max_budget: os.environ/LITELLM_MONTHLY_HARD_CAP
  upperbound_key_generate_params:
    max_budget: os.environ/LITELLM_MONTHLY_HARD_CAP
    budget_duration: "30d"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  fail_closed_budget_enforcement: true
  alerting: ["webhook"]
  alert_types: ["budget_alerts"]
  alerting_args:
    budget_alert_ttl: 86400
