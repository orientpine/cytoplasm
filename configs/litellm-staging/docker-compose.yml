name: autophagy-litellm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12

  alert-dispatcher:
    image: python:3.13-alpine
    restart: unless-stopped
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN must be set in .env}"
      DISCORD_OWNER_ID: "${DISCORD_OWNER_ID:?DISCORD_OWNER_ID must be set in .env}"
    command: ["python", "/app/alert_dispatcher.py"]
    volumes:
      - ./alert_dispatcher.py:/app/alert_dispatcher.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    restart: unless-stopped
    # PID 1 reaper: litellm(main-stable)은 PID 1로 뜨면 재입양된 고아 프로세스를
    # 회수하지 않아 zombie가 남는다(2026-07-22 관측: prisma node CLI 잔재).
    # tini를 PID 1로 두어 fail-closed하게 회수한다.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      alert-dispatcher:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set in .env}"
      LITELLM_MONTHLY_HARD_CAP: "${LITELLM_MONTHLY_HARD_CAP:?LITELLM_MONTHLY_HARD_CAP must be set in .env}"
      LITELLM_SALT_KEY: "${LITELLM_SALT_KEY:?LITELLM_SALT_KEY must be set in .env}"
      WEBHOOK_URL: "${WEBHOOK_URL:?WEBHOOK_URL must be set in .env}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./custom_callbacks.py:/app/custom_callbacks.py:ro
    command: ["--config=/app/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:4000/health/liveliness', headers={'Authorization': 'Bearer ' + os.environ['LITELLM_MASTER_KEY']}); urllib.request.urlopen(request, timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  litellm_postgres_data:
