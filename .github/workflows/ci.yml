# PR 검증 게이트 — 머지 전에 lint + 단위 테스트를 GitHub에서 돌린다.
#
# 이 워크플로는 GitHub-hosted 러너에서만 돌고 코드·PR 메타데이터 읽기 권한만 갖는다.
# 프로덕션(`<primary-node>`)에는 접근하지 않는다 — 배포는 여전히 노드 쪽 경로가 소유한다.
name: CI

on:
  # main push 재검증은 두지 않는다: PR 에서 이미 통과시킨 트리를 머지 직후 한 번 더 돌리는
  # 중복이었고, 2026-08-25 실측으로 최근 100 회 실행 중 48 회가 그것이었다. 머지되는 트리의
  # 판정은 PR 실행과 push 게이트(automation/local_ci.sh 영수증)가 이미 갖고 있다.
  pull_request:

permissions:
  contents: read
  pull-requests: read

# 같은 브랜치에 새 푸시가 오면 이전 실행을 취소한다(무료 플랜의 Actions 분 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    # 2026-09-28 실측: 단위 테스트만 13분, 잡 전체 12분 53초~15분 4초. 15분 한도에서 테스트가
    # 전부 통과한 잡이 취소됐다(PR #548) — 스위트 증가분까지 여유를 두어 30분으로 둔다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # 러너 이미지에는 bubblewrap 이 없다. 매번 apt-get update + install 을 하면 102~111초가 걸렸다
      # (2026-10-19 실측 5회). 그래서 Ubuntu 아카이브 색인(noble-updates·noble-security)의 sha256 으로
      # 고정한 .deb 두 개를 받아 설치한다. 받기·대조·설치 중 하나라도 실패하면 원래 apt 경로로 돌아간다 —
      # 빠른 길이 막혀도 검증은 그대로 돈다. 버전을 올릴 때는 아카이브 색인에서 이름과 sha256 을 함께 바꾼다.
      # 고정본도 dpkg -i 가 아니라 apt-get 으로 넣는다: dpkg -i 는 의존성이 빠지면 패키지를 반쯤 풀어 둔 채
      # 실패하고, 그 뒤 apt 경로까지 "Unmet dependencies" 로 깨진다(2026-10-19 컨테이너 실측). apt-get 은
      # 의존성을 먼저 풀어 보고 안 되면 아무것도 건드리지 않은 채 거절한다.
      # 내려받기는 파일당 최악 약 1분(연결 10초·전체 30초, 재시도 1회)에서 끊는다 — 주소가 멈춰도 폴백이
      # 원래 경로(약 105초)보다 크게 늦지 않게 한다. 파일은 50KB 안팎이다.
      - name: Install scenario process sandbox
        run: |
          set -euo pipefail
          pinned="$RUNNER_TEMP/sandbox-debs"
          install_pinned() {
            local base=https://launchpad.net/ubuntu/+archive/primary/+files
            mkdir -p "$pinned" || return 1
            while read -r digest name; do
              curl -fsSL --connect-timeout 10 --max-time 30 --retry 1 -o "$pinned/$name" "$base/$name" || return 1
              echo "$digest  $pinned/$name" | sha256sum -c - || return 1
            done <<'PINS'
          2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094 bubblewrap_0.9.0-1ubuntu0.3_amd64.deb
          90b02aa006eea7702cd4e851343e469e41365dda42145a3cb035de1d6c773b8c apparmor-profiles_4.0.1really4.0.1-0ubuntu0.24.04.9_all.deb
          PINS
            sudo apt-get install --yes --no-install-recommends "$pinned"/*.deb
          }
          if install_pinned; then
            echo "sandbox: pinned bubblewrap and apparmor-profiles installed"
          else
            echo "::warning::pinned sandbox packages did not install; falling back to apt-get"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
          fi
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-all --ro-bind / / /bin/true

      # skills/mail/vendor 는 무수정 vendoring 트리다(AGENTS.md: "소스는 byte-identical 유지").
      # 고칠 수 없는 트리를 린트하면 CI가 영구히 빨간불이 되므로 제외한다.
      - name: Lint
        run: ruff check . --exclude skills/mail/vendor

      - name: Unit tests
        # -n auto: 러너의 코어(4개)를 모두 쓴다. 시험은 하나도 빼지 않는다 — 2026-10-19 실측으로 직렬과
        # 병렬의 시험 id·상태 집합이 같았다. automation/local_ci.sh 가 같은 명령을 돈다.
        run: python -m pytest tests/unit -q -n auto
        env:
          GH_TOKEN: ${{ github.token }}

  # 공개 저장소에서는 브랜치를 push 하는 순간 공개된다. 그래서 막는 곳은 로컬 훅(public-gate-pre-commit·
  # commit-msg·pre-push)이고, 이 잡은 그 훅을 우회했을 때 잡아내는 두 번째 그물이다. 찾은 값은 로그에
  # 싣지 않는다(공개 저장소의 Actions 로그는 공개다). 금칙어 목록은 비밀 LEAK_DENYLIST 로만 받고,
  # 포크 PR 처럼 비밀이 없으면 경로·토폴로지 검사만 돈다.
  leak-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          archive=gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scanner reaches a planted canary
        run: |
          set -euo pipefail
          canary="$(mktemp -d)"
          probe="AKI""A""QYLPMN5HHHFPZAAA"
          printf 'aws_access_key_id = "%s"\n' "$probe" > "$canary/canary.txt"
          if gitleaks dir --no-banner --redact "$canary" >/dev/null 2>&1; then
            echo "gitleaks missed a planted canary; a zero-finding scan proves nothing" >&2
            exit 1
          fi

      - name: Secret scan of the PR commits
        run: gitleaks git --no-banner --redact --log-opts="origin/main..HEAD" .

      - name: Public leak gate
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
          PR_TEXT: ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_DENYLIST:-}" ]; then
            printf '%s\n' "$LEAK_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export PUBLIC_GATE_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          python3 -m automation.public_gate range origin/main HEAD --text-env PR_TEXT

  # 네이티브 윈도우(WSL 없음) 설치·상시 실행·업데이트를 깨끗한 windows-latest 에서 실제로 돌린다. README 의
  # 한 줄(install.ps1 을 iex 로)로 설치하고, 작업 스케줄러 두 항목(herdr 서버·dori serve)이 로그온 트리거로
  # 등록돼 지금 돌고 있는지, 서명 안 된 새 태그는 안 받는지, 서명된 새 판(새 포크 고정 커밋)으로 업데이트되고
  # 상시 루프가 새 코드로 다시 뜨는지까지 본다. 릴리스 채널은 이 잡이 만든 키로 서명한 로컬 저장소다(형의
  # 자격 증명·채널 없음). 시나리오 정본은 tests/windows/install-update.ps1 이다.
  windows-install:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 전체 이력: 시험이 이 커밋을 로컬 릴리스 저장소로 push 하는데, 얕은 클론에서는 push 가 거절된다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install, always-on tasks and update on native Windows
        shell: pwsh
        run: ./tests/windows/install-update.ps1 -Evidence "$env:RUNNER_TEMP/cyto-windows-evidence"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-evidence
          path: ${{ runner.temp }}/cyto-windows-evidence
          if-no-files-found: warn

  # 설치기 진입점은 제3자가 **아무것도 설치하기 전에** 처음 실행하는 명령이라,
  # 모듈 스코프에서 import하는 것이 그대로 미문서화 전제가 된다. 실제로 한 번
  # 깨졌다 — dcddaa21 이후 roster import가 모듈 스코프로 올라가 순수 dry-run이
  # ModuleNotFoundError traceback으로 죽었다. 러너 이미지는 갓 설치한 노드보다
  # 훨씬 많은 것을 갖고 있어 그 회귀를 가리므로, 빈 컨테이너에서 따로 돌린다.
  # **여기서는 의존성을 설치하지 않는다** — 설치하는 순간 이 잡의 존재 이유가 사라진다.
  clean-host-install:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Installer dry-run on a bare interpreter
        run: |
          set -euo pipefail
          key="$(mktemp -d)/update-trust.pub"
          python3 - "$key" <<'PY'
          import base64, sys
          algorithm = b"ssh-ed25519"
          blob = len(algorithm).to_bytes(4, "big") + algorithm
          blob += (32).to_bytes(4, "big") + bytes(range(32))
          material = base64.b64encode(blob).decode()
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              stream.write(f"ssh-ed25519 {material} ci-clean-host\n")
          PY
          python3 -m automation.install --dry-run
          python3 -m automation.install --profile core --update-trust-key "$key" --dry-run

      - name: Dori profile dry-run on a bare interpreter
        run: |
          set -euo pipefail
          python3 -m automation.install --dry-run --role okdori --role moodori

      - name: Third-party boundary tests on a bare interpreter
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet pytest
          python3 -m pytest tests/unit/test_install_third_party_boundary.py -q
